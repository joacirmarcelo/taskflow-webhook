<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow AI — FullLife</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;background:#0a0a0f;overflow:hidden;}
body{font-family:'DM Sans',system-ui,sans-serif;color:#e2e8f0;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#2a2a3d;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
input,textarea,select{font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tap:active{opacity:0.7;transform:scale(0.97);}
.col-scroll{overflow-y:auto;overflow-x:hidden;}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ─── COLORS & THEMES ───────────────────────────────────────────────────────
const THEMES={
  dark:{
    bg:"#0a0a0f",surface:"#12121a",card:"#1a1a26",card2:"#1e1e2e",border:"#2a2a3d",border2:"#343450",
    text:"#e2e8f0",textMuted:"#64748b",textDim:"#94a3b8",
  },
  light:{
    bg:"#f4f5f8",surface:"#ffffff",card:"#ffffff",card2:"#f0f1f5",border:"#dde1e8",border2:"#c8cdd8",
    text:"#1a1d27",textMuted:"#8a93a3",textDim:"#5a6273",
  },
};
const C={
  // accent palette (same in both themes)
  accent:"#00b886",accentDim:"#00b88618",accentSoft:"#00b88640",
  purple:"#7c3aed",purpleDim:"#7c3aed18",
  orange:"#f59e0b",orangeDim:"#f59e0b18",
  red:"#ef4444",redDim:"#ef444418",
  blue:"#3b82f6",blueDim:"#3b82f618",
  // structural (overwritten by applyTheme)
  ...THEMES.dark,
};
function applyTheme(name){ Object.assign(C, THEMES[name]||THEMES.dark); }
const STATUS={
  todo:{label:"A Fazer",color:C.blue,bg:C.blueDim},
  doing:{label:"Andamento",color:C.orange,bg:C.orangeDim},
  done:{label:"Concluído",color:C.accent,bg:C.accentDim},
};
const TYPES={
  task:{label:"Tarefa",icon:"✓",color:C.blue},
  commitment:{label:"Compromisso",icon:"📅",color:C.orange},
  pending:{label:"Pendente",icon:"⏳",color:C.purple},
  decision:{label:"Decisão",icon:"⚡",color:C.accent},
};
const PRIO={high:{label:"Alta",color:C.red},medium:{label:"Média",color:C.orange},low:{label:"Baixa",color:C.blue}};
const DAYS_PT=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MONTHS_PT=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// ─── STORAGE ───────────────────────────────────────────────────────────────
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const PROXY="";

async function zapiCall(inst,tok,path,method="GET",body=null){
  const url=`${PROXY}/zapi/instances/${inst}/token/${tok}${path}`;
  const opts={method,headers:{"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  return r.json();
}

// ─── MINI COMPONENTS ───────────────────────────────────────────────────────
const Tag=({color,bg,children,xs})=>(
  <span style={{background:bg||color+"22",color,border:`1px solid ${color}44`,borderRadius:5,
    padding:xs?"1px 5px":"2px 8px",fontSize:xs?9:10,fontWeight:600,whiteSpace:"nowrap"}}>
    {children}
  </span>
);
const Inp=({label,value,onChange,type="text",placeholder,hint})=>(
  <div style={{marginBottom:12}}>
    {label&&<div style={{fontSize:11,fontWeight:600,color:C.textDim,marginBottom:5,letterSpacing:"0.05em"}}>{label}</div>}
    <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{
      width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
      color:C.text,padding:"11px 12px",outline:"none",fontSize:13,
      fontFamily:type==="password"?"DM Mono,monospace":"inherit"}}/>
    {hint&&<div style={{fontSize:10,color:C.textMuted,marginTop:4}}>{hint}</div>}
  </div>
);
function Spinner({size=16,color=C.accent}){
  return <div style={{width:size,height:size,border:`2px solid ${color}33`,borderTop:`2px solid ${color}`,
    borderRadius:"50%",animation:"spin 0.7s linear infinite",flexShrink:0}}/>;
}
function Toggle({on,onChange}){
  return(
    <div onClick={()=>onChange(!on)} style={{width:38,height:20,borderRadius:10,
      background:on?C.accent:C.border,cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}}>
      <div style={{position:"absolute",top:2,left:on?20:2,width:16,height:16,borderRadius:"50%",
        background:"#fff",transition:"left 0.2s"}}/>
    </div>
  );
}

// ─── TASK CARD ─────────────────────────────────────────────────────────────
function TaskCard({task,onStatus,onDelete,onClick,compact}){
  const tp=TYPES[task.type]||TYPES.task;
  const pr=PRIO[task.priority]||PRIO.medium;
  return(
    <div onClick={()=>onClick(task)} style={{
      background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${tp.color}`,
      borderRadius:10,padding:compact?"9px 10px":"11px 12px",cursor:"pointer",
      marginBottom:6,animation:"slideIn 0.2s",transition:"border-color 0.15s"}}
      onMouseEnter={e=>e.currentTarget.style.borderColor=C.border2}
      onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:4}}>
            <Tag color={tp.color} xs>{tp.icon} {tp.label}</Tag>
            <Tag color={pr.color} xs>{pr.label}</Tag>
          </div>
          <div style={{fontSize:13,fontWeight:600,color:C.text,lineHeight:1.4,marginBottom:4,
            overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>
            {task.title}
          </div>
          <div style={{fontSize:10,color:C.textMuted,display:"flex",gap:6,flexWrap:"wrap"}}>
            <span>📱 {task.contact}</span>
            {task.date&&<span>📅 {task.date}</span>}
          </div>
        </div>
        <button onClick={e=>{e.stopPropagation();onDelete(task.id);}}
          style={{background:"none",border:"none",color:C.textMuted,fontSize:15,padding:"1px 3px",cursor:"pointer",flexShrink:0}}>✕</button>
      </div>
      {!compact&&(
        <div style={{display:"flex",gap:4,marginTop:8,flexWrap:"wrap"}}>
          {Object.entries(STATUS).map(([k,cfg])=>(
            <button key={k} onClick={e=>{e.stopPropagation();onStatus(task.id,k);}} style={{
              background:task.status===k?cfg.bg:"transparent",
              border:`1px solid ${task.status===k?cfg.color:C.border}`,
              color:task.status===k?cfg.color:C.textMuted,
              borderRadius:16,padding:"3px 8px",fontSize:9,fontWeight:600,cursor:"pointer"}}>
              {cfg.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── MAIN APP ──────────────────────────────────────────────────────────────
function App(){
  // Theme (light/dark)
  const [theme,setTheme]=useState(()=>LS.get("tf_theme","dark"));
  applyTheme(theme); // apply synchronously so C reflects current theme during render
  useEffect(()=>{
    LS.set("tf_theme",theme);
    document.documentElement.style.background=THEMES[theme].bg;
    document.body.style.background=THEMES[theme].bg;
  },[theme]);
  // Keys & settings
  const [claudeKey,setClaudeKey]=useState(()=>LS.get("tf_claude",""));
  const [openaiKey,setOpenaiKey]=useState(()=>LS.get("tf_openai",""));
  const [zapiInst,setZapiInst]=useState(()=>LS.get("tf_inst",""));
  const [zapiTok,setZapiTok]=useState(()=>LS.get("tf_tok",""));
  useEffect(()=>LS.set("tf_claude",claudeKey),[claudeKey]);
  useEffect(()=>LS.set("tf_openai",openaiKey),[openaiKey]);
  useEffect(()=>LS.set("tf_inst",zapiInst),[zapiInst]);
  useEffect(()=>LS.set("tf_tok",zapiTok),[zapiTok]);

  // Tasks
  const [tasks,setTasks]=useState(()=>LS.get("tf_tasks",[]));
  useEffect(()=>LS.set("tf_tasks",tasks),[tasks]);

  // Whatsapp
  const [chats,setChats]=useState([]);
  const [monitored,setMonitored]=useState(()=>LS.get("tf_monitored",[]));
  // WhatsApp panel state (lifted from WaPanel to prevent re-mount flicker/black screen)
  const [waTab,setWaTab]=useState("pending");
  const [webhookSenders,setWebhookSenders]=useState([]);
  const [loadingWA,setLoadingWA]=useState(false);
  const [newContact,setNewContact]=useState("");
  useEffect(()=>LS.set("tf_monitored",monitored),[monitored]);
  const [zapiStatus,setZapiStatus]=useState("disconnected");
  const [qr,setQr]=useState(null);
  const [zapiErr,setZapiErr]=useState(null);
  const [checkingConn,setChecking]=useState(false);

  // Sync
  const [syncing,setSyncing]=useState(false);
  const [syncLog,setSyncLog]=useState([]);
  const [lastSync,setLastSync]=useState(()=>LS.get("tf_lastsync",""));
  const [newBadge,setNewBadge]=useState(0);
  const [autoSync,setAutoSync]=useState(()=>LS.get("tf_autosync",true));
  useEffect(()=>LS.set("tf_lastsync",lastSync),[lastSync]);
  useEffect(()=>LS.set("tf_autosync",autoSync),[autoSync]);

  // UI state
  const [panel,setPanel]=useState(null); // "settings"|null (overlay panels)
  const [mainTab,setMainTab]=useState("whatsapp"); // "whatsapp"|"tasks"|"agenda"
  const [selected,setSelected]=useState(null);
  const [notif,setNotif]=useState(null);
  const [filterStatus,setFilterStatus]=useState("all");
  const [filterPrio,setFilterPrio]=useState("all");
  const [taskSel,setTaskSel]=useState([]); // ids of selected tasks for bulk actions
  const [search,setSearch]=useState("");

  // Agenda
  const today=new Date();
  const [calMonth,setCalMonth]=useState(today.getMonth());
  const [calYear,setCalYear]=useState(today.getFullYear());
  const [selDay,setSelDay]=useState(today.getDate());
  const [slots,setSlots]=useState(()=>LS.get("tf_slots",{}));
  // Calendar batch-selection mode for applying available hours to multiple dates
  const [selectMode,setSelectMode]=useState(false);
  const [multiDays,setMultiDays]=useState([]); // array of day numbers in current month
  const [batchTime,setBatchTime]=useState("09:00");
  const [batchDur,setBatchDur]=useState("30");
  const [agendaItems,setAgendaItems]=useState(()=>LS.get("tf_agenda",[]));
  const [suggestions,setSuggestions]=useState([]); // pending IA scheduling suggestions
  const [sugEdit,setSugEdit]=useState({}); // edited message text per suggestion id
  const [newSlotTime,setNewSlotTime]=useState("08:00");
  const [newSlotDur,setNewSlotDur]=useState("30");
  const [schedModal,setSchedModal]=useState(null);
  const [sendingMsg,setSendingMsg]=useState(false);
  const [showSlotConfig,setShowSlotConfig]=useState(false);
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  const [modalSchedDate,setModalSchedDate]=useState(todayStr);
  const [modalSchedTime,setModalSchedTime]=useState("09:00");
  const [modalSchedMsg,setModalSchedMsg]=useState("");
  const [savingDirectSched,setSavingDirectSched]=useState(false);
  const [sendingDirectMsg,setSendingDirectMsg]=useState(false);
  // Programar envio futuro
  const [progDate,setProgDate]=useState(todayStr);
  const [progTime,setProgTime]=useState("08:00");
  const [scheduling,setScheduling]=useState(false);
  const [scheduledMsgs,setScheduledMsgs]=useState([]);

  // Generate default WA message
  function genMsg(contact,date,time){
    if(!date||!time)return"";
    const dateObj=new Date(date+"T12:00:00");
    const dateFmt=dateObj.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
    return`Olá ${contact||""}! 😊\n\nSobre o seu contato conosco:\n\nTemos disponibilidade no dia *${dateFmt}* às *${time}*.\n\nPodemos confirmar esse horário?`;
  }
  // Reset message when date/time/contact changes
  useEffect(()=>{
    if(selected) setModalSchedMsg(genMsg(selected.contact,modalSchedDate,modalSchedTime));
  },[modalSchedDate,modalSchedTime,selected?.id]);
  useEffect(()=>{
    LS.set("tf_slots",slots);
    // Sync available slots to server so the IA can suggest times
    fetch("/suggestions/sync-slots",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slots})}).catch(()=>{});
  },[slots]);
  useEffect(()=>LS.set("tf_agenda",agendaItems),[agendaItems]);

  // Chat
  const [chatMsgs,setChatMsgs]=useState([{role:"assistant",content:"Olá Joacir! Sou sua assistente estratégica da FullLife. Tenho contexto sobre a Unirad, SumCare e Carepay. Como posso ajudar?"}]);
  const [chatIn,setChatIn]=useState("");
  const [chatLoad,setChatLoad]=useState(false);
  const chatEnd=useRef(null);

  // Right column WhatsApp inline
  const [rightThread,setRightThread]=useState(null);
  const [aiDrawer,setAiDrawer]=useState(false);
  const [replyDraft,setReplyDraft]=useState("");
  const [sendingReply,setSendingReply]=useState(false);
  const [replyTo,setReplyTo]=useState(null); // message being replied to (quote)
  const [forwardMsg,setForwardMsg]=useState(null); // message being forwarded
  const [forwardTo,setForwardTo]=useState(""); // target phone for forward
  const [fwdSearch,setFwdSearch]=useState(""); // search in forward modal
  const [msgMenu,setMsgMenu]=useState(null); // id of message whose menu is open
  const [rightMsgs,setRightMsgs]=useState([]);
  const [rightLoading,setRightLoading]=useState(false);

  const [autoReplyList,setAutoReplyList]=useState([]);
  const [contactNames,setContactNames]=useState(()=>LS.get("tf_contactNames",{})); // phone→name from Z-API sync
  useEffect(()=>LS.set("tf_contactNames",contactNames),[contactNames]);
  const [autoReplyModal,setAutoReplyModal]=useState(null);

  const loadAutoReply=useCallback(()=>{
    fetch("/auto-reply").then(r=>r.json()).then(d=>setAutoReplyList(Array.isArray(d)?d:[])).catch(()=>{});
  },[]);
  useEffect(()=>{ loadAutoReply(); },[]);

  // Find auto-reply config for a phone (last-8 match)
  const autoFor=useCallback((phone)=>{
    const p8=String(phone||"").replace(/\D/g,"").slice(-8);
    return autoReplyList.find(c=>c&&String(c.phone||"").replace(/\D/g,"").slice(-8)===p8)||null;
  },[autoReplyList]);

  // Toggle automation on/off for a contact (creates config if missing)
  const toggleAuto=useCallback((phone,name,enabled,mode)=>{
    const existing=autoFor(phone);
    const body={phone,name:name||phone,enabled,
      mode:mode||existing?.mode||"auto",
      instructions:existing?.instructions||"",
      globalInstructions:existing?.globalInstructions||"",
      fallbackMsg:existing?.fallbackMsg||"",
      sequence:existing?.sequence||[],
      zapiInst,zapiTok,claudeKey:claudeKey||""};
    fetch("/auto-reply/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)}).then(()=>loadAutoReply()).catch(()=>{});
  },[autoFor,zapiInst,zapiTok,claudeKey,loadAutoReply]);

  // Set AI mode (auto = responds alone, suggest = drafts for approval)
  const setAiMode=useCallback((phone,name,mode)=>{
    const existing=autoFor(phone);
    const body={phone,name:name||phone,
      enabled:existing?.enabled??true,mode,
      instructions:existing?.instructions||"",
      globalInstructions:existing?.globalInstructions||"",
      fallbackMsg:existing?.fallbackMsg||"",
      sequence:existing?.sequence||[],
      zapiInst,zapiTok,claudeKey:claudeKey||""};
    fetch("/auto-reply/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)}).then(()=>loadAutoReply()).catch(()=>{});
  },[autoFor,zapiInst,zapiTok,claudeKey,loadAutoReply]);

  const loadRightMsgs=useCallback((silent=false)=>{
    if(silent!==true)setRightLoading(true);
    fetch("/webhook-messages/all")
      .then(r=>r.ok?r.json():fetch("/webhook-messages").then(r2=>r2.json()))
      .then(d=>{ setRightMsgs(Array.isArray(d)?d:[]); setRightLoading(false); })
      .catch(()=>setRightLoading(false));
  },[]);

  useEffect(()=>{
    console.log("🔧 TaskFlow v3.2 loaded");
    // Auto-purge LID ghosts + sync contacts to build LID map
    fetch("/webhook-messages/purge-lids",{method:"POST"})
      .then(r=>r.json()).then(d=>{if(d.purged>0)console.log(`🧹 Purged ${d.purged} LID ghosts`);})
      .catch(()=>{});
    // Auto-sync contacts (if Z-API configured)
    if(zapiInst&&zapiTok){
      fetch("/sync-contacts",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({zapiInst,zapiTok})})
        .then(r=>r.json()).then(d=>{
          if(d.ok&&d.nameMap){setContactNames(d.nameMap);console.log(`📇 Synced ${Object.keys(d.nameMap).length} contact names`);}
        }).catch(()=>{});
    }
    loadRightMsgs();
  },[]);

  // Poll silently every 8s so phone interactions appear quickly without flicker
  useEffect(()=>{
    const t=setInterval(()=>loadRightMsgs(true),8000);
    return()=>clearInterval(t);
  },[loadRightMsgs]);

  // Poll IA scheduling suggestions
  const loadSuggestions=useCallback(()=>{
    fetch("/suggestions").then(r=>r.json()).then(d=>setSuggestions(Array.isArray(d)?d:[])).catch(()=>{});
  },[]);
  useEffect(()=>{
    loadSuggestions();
    const t=setInterval(loadSuggestions,8000);
    return()=>clearInterval(t);
  },[loadSuggestions]);

  // Refresh immediately when window regains focus (e.g. after using phone)
  useEffect(()=>{
    const onFocus=()=>loadRightMsgs(true);
    window.addEventListener("focus",onFocus);
    document.addEventListener("visibilitychange",onFocus);
    return()=>{window.removeEventListener("focus",onFocus);document.removeEventListener("visibilitychange",onFocus);};
  },[loadRightMsgs]);

  // Refs for closures
  const syncingRef=useRef(false);
  const tasksRef=useRef(tasks);
  const monitoredRef=useRef(monitored);
  const claudeKeyRef=useRef(claudeKey);
  const uid=useRef(Date.now());

  useEffect(()=>{tasksRef.current=tasks;},[tasks]);
  useEffect(()=>{monitoredRef.current=monitored;},[monitored]);
  useEffect(()=>{claudeKeyRef.current=claudeKey;},[claudeKey]);
  useEffect(()=>{chatEnd.current?.scrollIntoView({behavior:"smooth"});},[chatMsgs]);

  const connected=zapiStatus==="connected";

  // Load webhook senders when WhatsApp panel opens (replaces WaPanel internal effect)
  useEffect(()=>{
    if(panel!=="whatsapp")return;
    setLoadingWA(true);
    fetch("/webhook-messages/all")
      .then(r=>r.ok?r.json():fetch("/webhook-messages").then(r2=>r2.json()))
      .then(msgs=>{
        const byPhone={};
        (Array.isArray(msgs)?msgs:[]).forEach(m=>{
          if(m.fromMe)return;
          const p=normPhone(m.phone);
          if(!p)return;
          if(!byPhone[p])byPhone[p]={phone:p,name:p,msgs:[],lastMsg:"",lastTime:""};
          if(m.senderName&&m.senderName!=="Você"&&m.senderName.trim().length>1)byPhone[p].name=m.senderName;
          byPhone[p].msgs.push(m);
          if(!byPhone[p].lastMsg){byPhone[p].lastMsg=m.text?.slice(0,60)||"";byPhone[p].lastTime=m.receivedAt||"";}
        });
        setWebhookSenders(Object.values(byPhone));
        setLoadingWA(false);
      }).catch(()=>setLoadingWA(false));
  },[panel,normPhone]);

  // Phone normalization — strips WhatsApp LID format, null-safe (CRITICAL: used by rByKey)
  const normPhone=useCallback((raw)=>{
    try{
      const digits=String(raw||"").replace(/@\S+$/,"").replace(/:\d+$/,"").replace(/\D/g,"");
      if(!digits)return"";
      if(digits.length<=13)return digits;
      const known=[...autoReplyList.filter(Boolean).map(c=>String(c.phone||"")),
                   ...monitored.filter(Boolean)].map(p=>String(p).replace(/\D/g,"")).filter(Boolean);
      const p12=digits.slice(0,12),p13=digits.slice(0,13);
      const m12=known.some(k=>k.slice(-8)===p12.slice(-8));
      const m13=known.some(k=>k.slice(-8)===p13.slice(-8));
      if(m12&&!m13)return p12;
      if(m13&&!m12)return p13;
      return p12;
    }catch{return String(raw||"").replace(/\D/g,"").slice(0,13);}
  },[autoReplyList,monitored]);

  const notify=(msg,color=C.accent)=>{
    setNotif({msg,color});
    setTimeout(()=>setNotif(null),3500);
  };
  const onStatus=(id,s)=>setTasks(p=>p.map(t=>t.id===id?{...t,status:s}:t));
  const onDelete=(id)=>{setTasks(p=>p.filter(t=>t.id!==id));notify("Tarefa removida.",C.red);};

  // Stats
  const stats={
    total:tasks.length,
    todo:tasks.filter(t=>t.status==="todo").length,
    doing:tasks.filter(t=>t.status==="doing").length,
    done:tasks.filter(t=>t.status==="done").length,
    urgent:tasks.filter(t=>t.priority==="high"&&t.status!=="done").length,
  };

  // ── ZAPI ────────────────────────────────────────────────────
  async function checkConn(){
    if(!zapiInst||!zapiTok)return false;
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/status");
      if(d?.connected){setZapiStatus("connected");setQr(null);return true;}
      return false;
    }catch{return false;}
  }
  async function loadChats(){
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/chats");
      if(Array.isArray(d))setChats(d);
    }catch{setZapiErr("Erro ao buscar conversas.");}
  }
  async function fetchQr(){
    const already=await checkConn();
    if(already){loadChats();notify("WhatsApp já conectado! ✓");return;}
    if(!zapiInst||!zapiTok){notify("Configure credenciais em Config.",C.red);setPanel("settings");return;}
    setZapiStatus("connecting");setZapiErr(null);

  rightMsgs.forEach(m=>{

    if(m.isGroup){
      // Prefer a real group name; ignore "Grupo …xxxx" placeholders when a real one is known
      const gn=m.groupName||"";
      const isPlaceholder=/^Grupo\s/.test(gn);

    }

                    {sendingDirectMsg&&<Spinner size={12} color={C.purple}/>}
                    📱 Enviar notificação WhatsApp (sem agendar)
                  </button>
                  <button onClick={()=>saveAndNotify(selected)} disabled={savingDirectSched||sendingDirectMsg||!modalSchedDate||!modalSchedTime}
                    style={{width:"100%",background:C.accent,color:"#000",border:"none",borderRadius:8,
                      padding:"10px",fontSize:12,fontWeight:700,
                      cursor:savingDirectSched||sendingDirectMsg?"not-allowed":"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    {(savingDirectSched||sendingDirectMsg)&&<Spinner size={12} color="#000"/>}
                    ✓ Salvar e Notificar WhatsApp
                  </button>
                </div>

                {/* Programar envio futuro */}
                <div style={{marginTop:12,borderTop:`1px solid ${C.border}`,paddingTop:12}}>
                  <div style={{fontSize:10,fontWeight:700,color:C.textMuted,marginBottom:8,letterSpacing:"0.04em"}}>⏰ PROGRAMAR ENVIO FUTURO</div>
                  <div style={{fontSize:10,color:C.textMuted,marginBottom:8}}>Envia automaticamente a mensagem acima na data e hora abaixo, mesmo com o app fechado.</div>
                  <div style={{display:"flex",gap:6,marginBottom:8}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:9,color:C.textMuted,marginBottom:2}}>Data</div>
                      <input type="date" value={progDate} onChange={e=>setProgDate(e.target.value)}
                        style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,
                          color:C.text,padding:"6px 8px",fontSize:11,outline:"none"}}/>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:9,color:C.textMuted,marginBottom:2}}>Hora</div>
                      <input type="time" value={progTime} onChange={e=>setProgTime(e.target.value)}
                        style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,
                          color:C.text,padding:"6px 8px",fontSize:11,outline:"none"}}/>
                    </div>
                  </div>
                  {progDate&&progTime&&(
                    <div style={{fontSize:10,color:C.orange,marginBottom:8,padding:"4px 8px",
                      background:C.orangeDim,borderRadius:5,border:`1px solid ${C.orange}33`}}>
                      ⏰ Envio em: {new Date(progDate+"T"+progTime+":00").toLocaleString("pt-BR",{weekday:"long",day:"2-digit",month:"long",hour:"2-digit",minute:"2-digit"})}
                    </div>
                  )}
                  <button onClick={()=>scheduleMessage(selected)} disabled={scheduling}
                    style={{width:"100%",background:scheduling?C.border:C.orangeDim,
                      border:`1px solid ${scheduling?C.border:C.orange}`,
                      color:scheduling?C.textMuted:C.orange,borderRadius:8,padding:"9px",
                      fontSize:12,fontWeight:700,cursor:scheduling?"not-allowed":"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    {scheduling&&<Spinner size={12} color={C.orange}/>}
                    {scheduling?"Programando...":"⏰ Programar envio"}
                  </button>
                </div>
              </div>
            )}

            {/* Remove / Close */}
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>{onDelete(selected.id);setSelected(null);}}
                style={{flex:1,background:"transparent",border:`1px solid ${C.red}44`,color:C.red,
                  borderRadius:8,padding:"9px",fontSize:12,fontWeight:600,cursor:"pointer"}}>🗑 Remover</button>
              <button onClick={()=>setSelected(null)} style={{flex:1,background:"transparent",
                border:`1px solid ${C.border}`,color:C.textMuted,borderRadius:8,padding:"9px",
                fontSize:12,cursor:"pointer"}}>Fechar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
