<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow AI — FullLife</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;background:#0a0a0f;overflow:hidden;}
body{font-family:'DM Sans',system-ui,sans-serif;color:#e2e8f0;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#2a2a3d;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
input,textarea,select{font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tap:active{opacity:0.7;transform:scale(0.97);}
.col-scroll{overflow-y:auto;overflow-x:hidden;}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ─── COLORS ────────────────────────────────────────────────────────────────
const C={
  bg:"#0a0a0f",surface:"#12121a",card:"#1a1a26",card2:"#1e1e2e",border:"#2a2a3d",border2:"#343450",
  accent:"#00e5a0",accentDim:"#00e5a012",accentSoft:"#00e5a035",
  purple:"#7c3aed",purpleDim:"#7c3aed18",
  orange:"#f59e0b",orangeDim:"#f59e0b18",
  red:"#ef4444",redDim:"#ef444418",
  blue:"#3b82f6",blueDim:"#3b82f618",
  text:"#e2e8f0",textMuted:"#64748b",textDim:"#94a3b8",
};
const STATUS={
  todo:{label:"A Fazer",color:C.blue,bg:C.blueDim},
  doing:{label:"Andamento",color:C.orange,bg:C.orangeDim},
  done:{label:"Concluído",color:C.accent,bg:C.accentDim},
};
const TYPES={
  task:{label:"Tarefa",icon:"✓",color:C.blue},
  commitment:{label:"Compromisso",icon:"📅",color:C.orange},
  pending:{label:"Pendente",icon:"⏳",color:C.purple},
  decision:{label:"Decisão",icon:"⚡",color:C.accent},
};
const PRIO={high:{label:"Alta",color:C.red},medium:{label:"Média",color:C.orange},low:{label:"Baixa",color:C.blue}};
const DAYS_PT=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MONTHS_PT=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// ─── STORAGE ───────────────────────────────────────────────────────────────
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const PROXY="";

async function zapiCall(inst,tok,path,method="GET",body=null){
  const url=`${PROXY}/zapi/instances/${inst}/token/${tok}${path}`;
  const opts={method,headers:{"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  return r.json();
}

// ─── MINI COMPONENTS ───────────────────────────────────────────────────────
const Tag=({color,bg,children,xs})=>(
  <span style={{background:bg||color+"22",color,border:`1px solid ${color}44`,borderRadius:5,
    padding:xs?"1px 5px":"2px 8px",fontSize:xs?9:10,fontWeight:600,whiteSpace:"nowrap"}}>
    {children}
  </span>
);
const Inp=({label,value,onChange,type="text",placeholder,hint})=>(
  <div style={{marginBottom:12}}>
    {label&&<div style={{fontSize:13,fontWeight:600,color:C.textDim,marginBottom:5,letterSpacing:"0.05em"}}>{label}</div>}
    <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{
      width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
      color:C.text,padding:"11px 12px",outline:"none",fontSize:15,
      fontFamily:type==="password"?"DM Mono,monospace":"inherit"}}/>
    {hint&&<div style={{fontSize:12,color:C.textMuted,marginTop:4}}>{hint}</div>}
  </div>
);
function Spinner({size=16,color=C.accent}){
  return <div style={{width:size,height:size,border:`2px solid ${color}33`,borderTop:`2px solid ${color}`,
    borderRadius:"50%",animation:"spin 0.7s linear infinite",flexShrink:0}}/>;
}
function Toggle({on,onChange}){
  return(
    <div onClick={()=>onChange(!on)} style={{width:38,height:20,borderRadius:10,
      background:on?C.accent:C.border,cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}}>
      <div style={{position:"absolute",top:2,left:on?20:2,width:16,height:16,borderRadius:"50%",
        background:"#fff",transition:"left 0.2s"}}/>
    </div>
  );
}

// ─── TASK CARD ─────────────────────────────────────────────────────────────
function TaskCard({task,onStatus,onDelete,onClick,compact}){
  const tp=TYPES[task.type]||TYPES.task;
  const pr=PRIO[task.priority]||PRIO.medium;
  return(
    <div onClick={()=>onClick(task)} style={{
      background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${tp.color}`,
      borderRadius:10,padding:compact?"9px 10px":"11px 12px",cursor:"pointer",
      marginBottom:6,animation:"slideIn 0.2s",transition:"border-color 0.15s"}}
      onMouseEnter={e=>e.currentTarget.style.borderColor=C.border2}
      onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:4}}>
            <Tag color={tp.color} xs>{tp.icon} {tp.label}</Tag>
            <Tag color={pr.color} xs>{pr.label}</Tag>
          </div>
          <div style={{fontSize:15,fontWeight:600,color:C.text,lineHeight:1.4,marginBottom:4,
            overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>
            {task.title}
          </div>
          <div style={{fontSize:12,color:C.textMuted,display:"flex",gap:6,flexWrap:"wrap"}}>
            <span>📱 {task.contact}</span>
            {task.date&&<span>📅 {task.date}</span>}
          </div>
        </div>
        <button onClick={e=>{e.stopPropagation();onDelete(task.id);}}
          style={{background:"none",border:"none",color:C.textMuted,fontSize:17,padding:"1px 3px",cursor:"pointer",flexShrink:0}}>✕</button>
      </div>
      {!compact&&(
        <div style={{display:"flex",gap:4,marginTop:8,flexWrap:"wrap"}}>
          {Object.entries(STATUS).map(([k,cfg])=>(
            <button key={k} onClick={e=>{e.stopPropagation();onStatus(task.id,k);}} style={{
              background:task.status===k?cfg.bg:"transparent",
              border:`1px solid ${task.status===k?cfg.color:C.border}`,
              color:task.status===k?cfg.color:C.textMuted,
              borderRadius:16,padding:"3px 8px",fontSize:10,fontWeight:600,cursor:"pointer"}}>
              {cfg.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── MAIN APP ──────────────────────────────────────────────────────────────
function App(){
  // Keys & settings
  const [claudeKey,setClaudeKey]=useState(()=>LS.get("tf_claude",""));
  const [openaiKey,setOpenaiKey]=useState(()=>LS.get("tf_openai",""));
  const [zapiInst,setZapiInst]=useState(()=>LS.get("tf_inst",""));
  const [zapiTok,setZapiTok]=useState(()=>LS.get("tf_tok",""));
  useEffect(()=>LS.set("tf_claude",claudeKey),[claudeKey]);
  useEffect(()=>LS.set("tf_openai",openaiKey),[openaiKey]);
  useEffect(()=>LS.set("tf_inst",zapiInst),[zapiInst]);
  useEffect(()=>LS.set("tf_tok",zapiTok),[zapiTok]);

  // Tasks
  const [tasks,setTasks]=useState(()=>LS.get("tf_tasks",[]));
  useEffect(()=>LS.set("tf_tasks",tasks),[tasks]);

  // Whatsapp
  const [chats,setChats]=useState([]);
  const [monitored,setMonitored]=useState(()=>LS.get("tf_monitored",[]));
  useEffect(()=>LS.set("tf_monitored",monitored),[monitored]);
  const [zapiStatus,setZapiStatus]=useState("disconnected");
  const [qr,setQr]=useState(null);
  const [zapiErr,setZapiErr]=useState(null);
  const [checkingConn,setChecking]=useState(false);

  // Sync
  const [syncing,setSyncing]=useState(false);
  const [syncLog,setSyncLog]=useState([]);
  const [lastSync,setLastSync]=useState(()=>LS.get("tf_lastsync",""));
  const [newBadge,setNewBadge]=useState(0);
  const [autoSync,setAutoSync]=useState(()=>LS.get("tf_autosync",true));
  useEffect(()=>LS.set("tf_lastsync",lastSync),[lastSync]);
  useEffect(()=>LS.set("tf_autosync",autoSync),[autoSync]);

  // UI state
  const [panel,setPanel]=useState(null); // "whatsapp"|"settings"|null
  const [selected,setSelected]=useState(null);
  const [notif,setNotif]=useState(null);
  const [filterStatus,setFilterStatus]=useState("all");
  const [filterPrio,setFilterPrio]=useState("all");
  const [search,setSearch]=useState("");

  // Agenda
  const today=new Date();
  const [calMonth,setCalMonth]=useState(today.getMonth());
  const [calYear,setCalYear]=useState(today.getFullYear());
  const [selDay,setSelDay]=useState(today.getDate());
  const [slots,setSlots]=useState(()=>LS.get("tf_slots",{}));
  const [agendaItems,setAgendaItems]=useState(()=>LS.get("tf_agenda",[]));
  const [newSlotTime,setNewSlotTime]=useState("08:00");
  const [newSlotDur,setNewSlotDur]=useState("30");
  const [schedModal,setSchedModal]=useState(null);
  const [sendingMsg,setSendingMsg]=useState(false);
  const [showSlotConfig,setShowSlotConfig]=useState(false);
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  const [modalSchedDate,setModalSchedDate]=useState(todayStr);
  const [modalSchedTime,setModalSchedTime]=useState("09:00");
  const [modalSchedMsg,setModalSchedMsg]=useState("");
  const [savingDirectSched,setSavingDirectSched]=useState(false);
  const [sendingDirectMsg,setSendingDirectMsg]=useState(false);
  // Programar envio futuro
  const [progDate,setProgDate]=useState(todayStr);
  const [progTime,setProgTime]=useState("08:00");
  const [scheduling,setScheduling]=useState(false);
  const [scheduledMsgs,setScheduledMsgs]=useState([]);

  // Generate default WA message
  function genMsg(contact,date,time){
    if(!date||!time)return"";
    const dateObj=new Date(date+"T12:00:00");
    const dateFmt=dateObj.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
    return`Olá ${contact||""}! 😊\n\nSobre o seu contato conosco:\n\nTemos disponibilidade no dia *${dateFmt}* às *${time}*.\n\nPodemos confirmar esse horário?`;
  }
  // Reset message when date/time/contact changes
  useEffect(()=>{
    if(selected) setModalSchedMsg(genMsg(selected.contact,modalSchedDate,modalSchedTime));
  },[modalSchedDate,modalSchedTime,selected?.id]);
  useEffect(()=>LS.set("tf_slots",slots),[slots]);
  useEffect(()=>LS.set("tf_agenda",agendaItems),[agendaItems]);

  // Chat
  const [chatMsgs,setChatMsgs]=useState([{role:"assistant",content:"Olá Joacir! Sou sua assistente estratégica da FullLife. Tenho contexto sobre a Unirad, SumCare e Carepay. Como posso ajudar?"}]);
  const [chatIn,setChatIn]=useState("");
  const [chatLoad,setChatLoad]=useState(false);
  const chatEnd=useRef(null);

  // Right column WhatsApp inline
  const [rightThread,setRightThread]=useState(null);
  const [rightMsgs,setRightMsgs]=useState([]);
  const [rightLoading,setRightLoading]=useState(false);

  const [autoReplyList,setAutoReplyList]=useState([]);
  const [autoReplyModal,setAutoReplyModal]=useState(null);
  // Read tracking — phones whose messages have been opened
  const [readPhones,setReadPhones]=useState(()=>new Set(JSON.parse(localStorage.getItem("tf_read_phones")||"[]")));
  // Forward modal
  const [forwardModal,setForwardModal]=useState(null); // {type,mediaUrl,fileName,caption}
  const [forwardTarget,setForwardTarget]=useState("");
  const [forwarding,setForwarding]=useState(false);
  // Config panel tabs
  const [arTab,setArTab]=useState("learn");
  const [arGlobalInst,setArGlobalInst]=useState("Você é assistente do Sr. Joacir Marcelo Sgarbossa, empresário em Capão da Canoa/RS. Representa Unirad (saúde), SumCare (plano) e Carepay (pagamentos). Seja cordial e profissional.");
  const [arFallback,setArFallback]=useState("Peço desculpas pela limitação! Essa questão precisará da confirmação do Sr. Joacir Marcelo. Entrarei em contato o mais breve possível. 🙏");
  const [arContactInst,setArContactInst]=useState("");
  const [arSequence,setArSequence]=useState([]);
  const [arExtracted,setArExtracted]=useState(null);
  const [arExtracting,setArExtracting]=useState(false);
  const [arPanelOpen,setArPanelOpen]=useState(false);
  const [replyDraft,setReplyDraft]=useState("");
  const [aiSuggestion,setAiSuggestion]=useState(null);
  const [aiSugLoading,setAiSugLoading]=useState(false);
  const [sendingReply,setSendingReply]=useState(false);
  // WaPanel state — lifted to App to prevent reset on re-render
  const [waTab,setWaTab]=useState("pending");
  const [monConfigPhone,setMonConfigPhone]=useState(null);
  const [monTab,setMonTab]=useState("learn");
  const [webhookSenders,setWebhookSenders]=useState([]);
  const [loadingWA,setLoadingWA]=useState(false);
  const [newContact,setNewContact]=useState("");

  // When new messages arrive, remove those phones from readPhones so badge reappears
  useEffect(()=>{
    if(!rightMsgs.length)return;
    // Find phones with unread received messages that came after last read
    const unreadPhones=new Set();
    rightMsgs.forEach(m=>{
      const p=normPhone(m.phone);
      if(!m.fromMe&&!m.read&&!m.processed&&readPhones.has(p))unreadPhones.add(p);
    });
    if(unreadPhones.size>0){
      const next=new Set(readPhones);
      unreadPhones.forEach(p=>next.delete(p));
      setReadPhones(next);
      localStorage.setItem("tf_read_phones",JSON.stringify([...next]));
    }
  // eslint-disable-next-line
  },[rightMsgs]);

  const loadAutoReply=useCallback(()=>{
    fetch("/auto-reply").then(r=>r.json()).then(d=>setAutoReplyList(Array.isArray(d)?d:[])).catch(()=>{});
  },[]);
  useEffect(()=>{ loadAutoReply(); },[]);

  const loadRightMsgs=useCallback(()=>{
    setRightLoading(true);
    // Fix any LID phones first, then load
    fetch("/webhook-messages/fix-lids",{method:"POST"}).catch(()=>{})
      .finally(()=>{
        fetch("/webhook-messages/all")
          .then(r=>r.ok?r.json():fetch("/webhook-messages").then(r2=>r2.json()))
          .then(d=>{ setRightMsgs(Array.isArray(d)?d:[]); setRightLoading(false); })
          .catch(()=>setRightLoading(false));
      });
  },[]);

  useEffect(()=>{ loadRightMsgs(); },[]);

  // Poll to refresh right panel messages every 30s
  useEffect(()=>{
    const t=setInterval(loadRightMsgs,30000);
    return()=>clearInterval(t);
  },[loadRightMsgs]);

  // Refs for closures
  const syncingRef=useRef(false);
  const tasksRef=useRef(tasks);
  const monitoredRef=useRef(monitored);
  const claudeKeyRef=useRef(claudeKey);
  const uid=useRef(Date.now());

  useEffect(()=>{tasksRef.current=tasks;},[tasks]);
  useEffect(()=>{monitoredRef.current=monitored;},[monitored]);
  useEffect(()=>{claudeKeyRef.current=claudeKey;},[claudeKey]);
  useEffect(()=>{chatEnd.current?.scrollIntoView({behavior:"smooth"});},[chatMsgs]);

  const connected=zapiStatus==="connected";

  const notify=(msg,color=C.accent)=>{
    setNotif({msg,color});
    setTimeout(()=>setNotif(null),3500);
  };
  const onStatus=(id,s)=>setTasks(p=>p.map(t=>t.id===id?{...t,status:s}:t));
  const onDelete=(id)=>{setTasks(p=>p.filter(t=>t.id!==id));notify("Tarefa removida.",C.red);};

  // Stats
  const stats={
    total:tasks.length,
    todo:tasks.filter(t=>t.status==="todo").length,
    doing:tasks.filter(t=>t.status==="doing").length,
    done:tasks.filter(t=>t.status==="done").length,
    urgent:tasks.filter(t=>t.priority==="high"&&t.status!=="done").length,
  };

  // ── ZAPI ────────────────────────────────────────────────────
  async function checkConn(){
    if(!zapiInst||!zapiTok)return false;
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/status");
      if(d?.connected){setZapiStatus("connected");setQr(null);return true;}
      return false;
    }catch{return false;}
  }
  async function loadChats(){
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/chats");
      if(Array.isArray(d))setChats(d);
    }catch{setZapiErr("Erro ao buscar conversas.");}
  }
  async function fetchQr(){
    const already=await checkConn();
    if(already){loadChats();notify("WhatsApp já conectado! ✓");return;}
    if(!zapiInst||!zapiTok){notify("Configure credenciais em Config.",C.red);setPanel("settings");return;}
    setZapiStatus("connecting");setZapiErr(null);
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/qr-code/image");
      if(d?.value)setQr(d.value);
      else if(d?.connected){setZapiStatus("connected");setQr(null);loadChats();notify("Conectado! ✓");}
      else setZapiErr("Resposta inesperada: "+JSON.stringify(d).slice(0,80));
    }catch{setZapiErr("Erro de conexão.");setZapiStatus("disconnected");}
  }
  useEffect(()=>{
    if(zapiInst&&zapiTok) checkConn().then(ok=>{if(ok)loadChats();});
  },[]);

  // ── EXTRACT TASKS ───────────────────────────────────────────
  async function extractTasks(msgs,name){
    const key=claudeKeyRef.current;
    if(!key||!msgs.length)return[];
    const txt=msgs
      .filter(m=>m.text?.message||m.text||m.caption||m.body)
      .map(m=>{
        const ts=m.messageTimestamp?new Date(m.messageTimestamp*1000).toLocaleDateString("pt-BR"):"";
        const sender=m.fromMe?"Joacir":(m.senderName||m.pushname||name);
        return`[${ts}] ${sender}: ${m.text?.message||m.text||m.caption||m.body||""}`;
      }).filter(l=>l.length>15).join("\n");
    if(!txt.trim())return[];
    try{
      const r=await fetch("/claude",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          apiKey:key,model:"claude-sonnet-4-6",max_tokens:3000,
          system:`Você extrai tarefas de conversas WhatsApp da Unirad Centro de Saúde, Capão da Canoa/RS (empresa do Joacir Sgarbossa).
Extraia TODAS as tarefas, compromissos, pendências e decisões mencionadas.
Título específico: inclua nomes, valores e datas.
Responda APENAS JSON válido sem markdown:
{"items":[{"title":"titulo","type":"task|commitment|pending|decision","priority":"high|medium|low","contact":"nome","date":"YYYY-MM-DD ou null","notes":"contexto"}]}
high=urgente/financeiro/prazo curto. medium=reuniões/retornos. low=geral.`,
          messages:[{role:"user",content:`Conversa com ${name}:\n\n${txt}`}]
        })
      }).then(r=>r.json());
      const parsed=JSON.parse((r.content?.[0]?.text||"{}").replace(/```json\n?|```/g,"").trim());
      return(parsed.items||[]).map(i=>({
        id:++uid.current,title:i.title,
        type:["task","commitment","pending","decision"].includes(i.type)?i.type:"task",
        status:"todo",priority:["high","medium","low"].includes(i.priority)?i.priority:"medium",
        source:`WhatsApp — ${name}`,date:i.date||"",contact:i.contact||name,
        notes:i.notes||"",phone:"",createdAt:new Date().toISOString(),
      }));
    }catch(e){console.error(e);return[];}
  }

  // ── SYNC ─────────────────────────────────────────────────────
  async function processWebhookMessages(silent=false){
    if(syncingRef.current)return;
    if(!claudeKeyRef.current){
      if(!silent){notify("Configure API Key do Claude.",C.red);setPanel("settings");}
      return;
    }
    syncingRef.current=true;
    setSyncing(true);
    try{
      const allMsgs=await fetch("/webhook-messages").then(r=>r.json());
      if(!allMsgs.length){
        syncingRef.current=false;setSyncing(false);
        if(!silent)notify("Nenhuma mensagem nova no momento.",C.orange);
        return;
      }

      // Filter by monitored contacts
      const mon=monitoredRef.current;
      const msgs=mon.length>0
        ?allMsgs.filter(m=>{
            const p=String(m.phone||"").replace(/\D/g,"");
            return mon.some(monPhone=>{
              const mp=String(monPhone||"").replace(/\D/g,"");
              return p===mp||p.endsWith(mp.slice(-8))||mp.endsWith(p.slice(-8));
            });
          })
        :allMsgs;

      if(!msgs.length){
        if(!silent)notify(`${allMsgs.length} msg(s) recebida(s) — nenhum contato selecionado corresponde.`,C.orange);
        await fetch("/webhook-messages/clear",{method:"POST"});
        syncingRef.current=false;setSyncing(false);
        return;
      }

      setSyncLog([{name:"Processando...",status:`${msgs.length}/${allMsgs.length} msg(s)`,loading:true}]);

      // Group by sender
      const bySender={};
      msgs.forEach(m=>{
        const key=m.phone||"desconhecido";
        if(!bySender[key])bySender[key]={name:m.senderName||key,msgs:[],phone:m.phone||""};
        bySender[key].msgs.push(m);
      });

      const log=[];let total=0;
      for(const [,data] of Object.entries(bySender)){
        log.push({name:data.name,status:`${data.msgs.length} msg(s) — extraindo...`,loading:true});
        setSyncLog([...log]);
        const newT=await extractTasks(data.msgs,data.name);
        const withPhone=newT.map(t=>({...t,phone:data.phone}));
        const existingTitles=tasksRef.current.map(t=>t.title.toLowerCase());
        const unique=withPhone.filter(t=>!existingTitles.includes(t.title.toLowerCase()));
        total+=unique.length;
        setTasks(p=>[...unique,...p]);
        log[log.length-1]={name:data.name,status:`✓ ${unique.length} nova(s)`,loading:false};
        setSyncLog([...log]);
      }

  // Smart phone normalization — strips LID format using fingerprint approach
  // phoneFingerprint: last 8 of first 12 digits — immune to LID contamination
  // e.g. 5551975796221541641286 → first12=555197579622 → last8=97579622
  const normPhone=useCallback((raw)=>{
    const digits=String(raw||"").replace(/@\S+$/,"").replace(/:\d+$/,"").replace(/\D/g,"");
    if(digits.length<=12)return digits;
    if(digits.length===13){
      // Could be legit 13-digit (9-prefix) or 12-digit with LID '1'
      // Check if first-12 matches a known contact better than full-13
      const p12=digits.slice(0,12);
      const known=[...autoReplyList.map(c=>c.phone),...monitored].map(p=>p.replace(/\D/g,""));
      if(known.length>0){
        const fp12=p12.slice(-8);
        const fp13=digits.slice(-8);
        const m12=known.some(k=>k.replace(/\D/g,"").slice(-8)===fp12||k.replace(/\D/g,"").slice(0,12).slice(-8)===fp12);
        const m13=known.some(k=>k.replace(/\D/g,"").slice(-8)===fp13);
        if(m12&&!m13)return p12;
      }
      return digits;
    }
    // >13 digits: use first 12 (strips LID)
    return digits.slice(0,12);
  },[autoReplyList,monitored]);

                  // Name: only from received messages, never from "Você" (our own name)
                  if(!m.fromMe&&m.senderName&&m.senderName!=="Você"&&m.senderName.trim().length>1)rByKey[p].name=m.senderName;
                  // Fallback: check autoReplyList for known name
                  if(rByKey[p].name==="?"||rByKey[p].name===p){

                  // Only count as unread if thread never opened AND message not marked read on server

                    </div>
                    {s.unread>0&&<div style={{background:"#00a884",color:"#fff",borderRadius:"50%",width:17,height:17,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{s.unread}</div>}
                  </div>);

                                    </button>

                                    </div>

                                      style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:7,
                                        color:C.text,padding:"6px 9px",fontSize:11,resize:"none",outline:"none",fontFamily:"inherit",lineHeight:1.5}}/>
                                    <button onClick={async()=>{
                                      const entry=autoMatch||{phone,name,enabled:true};
                                      await fetch("/auto-reply/save",{method:"POST",headers:{"Content-Type":"application/json"},
                                        body:JSON.stringify({...entry,instructions:arContactInst,globalInstructions:arGlobalInst,
                                          fallbackMsg:arFallback,sequence:arSequence,zapiInst,zapiTok,claudeKey:claudeKey||""})});

                                      color:C.accent,borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>

                                    </button>

                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <div style={{fontSize:12,color:C.textMuted,fontWeight:700,letterSpacing:"0.04em"}}>💬 MENSAGEM DE RETORNO (WhatsApp)</div>
                    <button onClick={()=>setModalSchedMsg(genMsg(selected.contact,modalSchedDate,modalSchedTime))}
                      style={{background:"transparent",border:"none",color:C.textMuted,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>
                      ↺ Restaurar padrão
                    </button>
                  </div>
                  <textarea value={modalSchedMsg} onChange={e=>setModalSchedMsg(e.target.value)}
                    rows={5} style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,
                      borderRadius:8,color:C.text,padding:"9px 10px",fontSize:14,outline:"none",
                      resize:"vertical",fontFamily:"DM Sans,sans-serif",lineHeight:1.6}}/>
                </div>

                {/* 3 separate action buttons */}
                <div style={{display:"flex",gap:5,flexDirection:"column"}}>
                  <button onClick={()=>saveScheduleOnly(selected)} disabled={savingDirectSched||!modalSchedDate||!modalSchedTime}
                    style={{width:"100%",background:C.accentDim,border:`1px solid ${C.accentSoft}`,
                      color:C.accent,borderRadius:8,padding:"9px",fontSize:14,fontWeight:600,
                      cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    {savingDirectSched&&<Spinner size={12}/>}
                    📅 Salvar agendamento (sem notificar)
                  </button>
                  <button onClick={()=>sendWANotification(selected)} disabled={sendingDirectMsg||!modalSchedMsg.trim()}
                    style={{width:"100%",background:C.purpleDim,border:`1px solid ${C.purple}44`,
                      color:C.purple,borderRadius:8,padding:"9px",fontSize:14,fontWeight:600,
                      cursor:sendingDirectMsg?"not-allowed":"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    {sendingDirectMsg&&<Spinner size={12} color={C.purple}/>}
                    📱 Enviar notificação WhatsApp (sem agendar)
                  </button>
                  <button onClick={()=>saveAndNotify(selected)} disabled={savingDirectSched||sendingDirectMsg||!modalSchedDate||!modalSchedTime}
                    style={{width:"100%",background:C.accent,color:"#000",border:"none",borderRadius:8,
                      padding:"10px",fontSize:14,fontWeight:700,
                      cursor:savingDirectSched||sendingDirectMsg?"not-allowed":"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    {(savingDirectSched||sendingDirectMsg)&&<Spinner size={12} color="#000"/>}
                    ✓ Salvar e Notificar WhatsApp
                  </button>
                </div>

                {/* Programar envio futuro */}
                <div style={{marginTop:12,borderTop:`1px solid ${C.border}`,paddingTop:12}}>
                  <div style={{fontSize:12,fontWeight:700,color:C.textMuted,marginBottom:8,letterSpacing:"0.04em"}}>⏰ PROGRAMAR ENVIO FUTURO</div>
                  <div style={{fontSize:12,color:C.textMuted,marginBottom:8}}>Envia automaticamente a mensagem acima na data e hora abaixo, mesmo com o app fechado.</div>
                  <div style={{display:"flex",gap:6,marginBottom:8}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:10,color:C.textMuted,marginBottom:2}}>Data</div>
                      <input type="date" value={progDate} onChange={e=>setProgDate(e.target.value)}
                        style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,
                          color:C.text,padding:"6px 8px",fontSize:13,outline:"none"}}/>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:10,color:C.textMuted,marginBottom:2}}>Hora</div>
                      <input type="time" value={progTime} onChange={e=>setProgTime(e.target.value)}
                        style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,
                          color:C.text,padding:"6px 8px",fontSize:13,outline:"none"}}/>
                    </div>
                  </div>
                  {progDate&&progTime&&(
                    <div style={{fontSize:12,color:C.orange,marginBottom:8,padding:"4px 8px",
                      background:C.orangeDim,borderRadius:5,border:`1px solid ${C.orange}33`}}>
                      ⏰ Envio em: {new Date(progDate+"T"+progTime+":00").toLocaleString("pt-BR",{weekday:"long",day:"2-digit",month:"long",hour:"2-digit",minute:"2-digit"})}
                    </div>
                  )}
                  <button onClick={()=>scheduleMessage(selected)} disabled={scheduling}
                    style={{width:"100%",background:scheduling?C.border:C.orangeDim,
                      border:`1px solid ${scheduling?C.border:C.orange}`,
                      color:scheduling?C.textMuted:C.orange,borderRadius:8,padding:"9px",
                      fontSize:14,fontWeight:700,cursor:scheduling?"not-allowed":"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    {scheduling&&<Spinner size={12} color={C.orange}/>}
                    {scheduling?"Programando...":"⏰ Programar envio"}
                  </button>
                </div>
              </div>
            )}

            {/* Remove / Close */}
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>{onDelete(selected.id);setSelected(null);}}
                style={{flex:1,background:"transparent",border:`1px solid ${C.red}44`,color:C.red,
                  borderRadius:8,padding:"9px",fontSize:14,fontWeight:600,cursor:"pointer"}}>🗑 Remover</button>
              <button onClick={()=>setSelected(null)} style={{flex:1,background:"transparent",
                border:`1px solid ${C.border}`,color:C.textMuted,borderRadius:8,padding:"9px",
                fontSize:14,cursor:"pointer"}}>Fechar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
