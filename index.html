<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TaskFlow"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>TaskFlow AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;background:#0a0a0f}
body{overscroll-behavior-y:contain;font-family:'DM Sans','Segoe UI',system-ui,sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#2a2a3d;border-radius:4px}
input,textarea,select{font-family:'DM Sans',sans-serif;-webkit-appearance:none}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.tap:active{opacity:0.7;transform:scale(0.97)}
.row-tap:active{background:#1e1e2e!important}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const C={
  bg:"#0a0a0f",surface:"#12121a",card:"#1a1a26",border:"#2a2a3d",
  accent:"#00e5a0",accentDim:"#00e5a015",accentSoft:"#00e5a040",
  purple:"#7c3aed",purpleDim:"#7c3aed20",
  orange:"#f59e0b",orangeDim:"#f59e0b20",
  red:"#ef4444",redDim:"#ef444420",
  blue:"#3b82f6",blueDim:"#3b82f620",
  text:"#e2e8f0",textMuted:"#64748b",textDim:"#94a3b8",
};
const STATUS={
  todo:{label:"A Fazer",color:C.blue,bg:C.blueDim},
  doing:{label:"Em Andamento",color:C.orange,bg:C.orangeDim},
  done:{label:"Concluído",color:C.accent,bg:C.accentDim},
};
const TYPES={
  task:{label:"Tarefa",icon:"✓",color:C.blue},
  commitment:{label:"Compromisso",icon:"📅",color:C.orange},
  pending:{label:"Pendente",icon:"⏳",color:C.purple},
  decision:{label:"Decisão",icon:"⚡",color:C.accent},
};
const PRIO={
  high:{label:"Alta",color:C.red},
  medium:{label:"Média",color:C.orange},
  low:{label:"Baixa",color:C.blue},
};

const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

// Usa o proxy local em vez de chamar Z-API diretamente
const PROXY = window.location.origin.includes("localhost") || window.location.hostname.match(/^192\.168|^10\.|^172\./)
  ? window.location.origin
  : "";

async function zapiCall(inst, tok, path, method="GET", body=null){
  const url=`${PROXY}/zapi/instances/${inst}/token/${tok}${path}`;
  const opts={method,headers:{"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  return r.json();
}

const Tag=({color,bg,children,xs})=>(
  <span style={{background:bg||color+"22",color,border:`1px solid ${color}44`,
    borderRadius:6,padding:xs?"2px 6px":"3px 10px",fontSize:xs?9:11,fontWeight:600,whiteSpace:"nowrap"}}>
    {children}
  </span>
);
const Pill=({active,color,onClick,children})=>(
  <button onClick={onClick} style={{
    background:active?color+"22":"transparent",border:`1px solid ${active?color:C.border}`,
    color:active?color:C.textMuted,borderRadius:20,padding:"5px 14px",
    fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
    {children}
  </button>
);
const Inp=({label,value,onChange,type="text",placeholder,hint})=>(
  <div style={{marginBottom:14}}>
    {label&&<div style={{fontSize:11,fontWeight:600,color:C.textDim,marginBottom:6,letterSpacing:"0.05em"}}>{label}</div>}
    <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{
      width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,
      color:C.text,padding:"13px 14px",outline:"none",fontSize:14,
      fontFamily:type==="password"?"DM Mono,monospace":"inherit"}}/>
    {hint&&<div style={{fontSize:11,color:C.textMuted,marginTop:5}}>{hint}</div>}
  </div>
);
function Spinner({size=18,color=C.accent}){
  return <div style={{width:size,height:size,border:`2px solid ${color}33`,borderTop:`2px solid ${color}`,borderRadius:"50%",animation:"spin 0.7s linear infinite",flexShrink:0}}/>;
}

function TaskCard({task,onStatus,onDelete,onClick}){
  const tp=TYPES[task.type]||TYPES.task;
  const pr=PRIO[task.priority]||PRIO.medium;
  return(
    <div onClick={()=>onClick(task)} className="tap" style={{
      background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${tp.color}`,
      borderRadius:14,padding:"13px 13px 10px",cursor:"pointer",marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>
            <Tag color={tp.color} xs>{tp.icon} {tp.label}</Tag>
            <Tag color={pr.color} xs>{pr.label}</Tag>
          </div>
          <div style={{fontSize:14,fontWeight:600,color:C.text,lineHeight:1.4,marginBottom:5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{task.title}</div>
          <div style={{fontSize:11,color:C.textMuted,display:"flex",gap:8,flexWrap:"wrap"}}>
            <span>📱 {task.contact}</span>
            {task.date&&<span>📅 {task.date}</span>}
          </div>
        </div>
        <button onClick={e=>{e.stopPropagation();onDelete(task.id);}} style={{background:"none",border:"none",color:C.textMuted,fontSize:18,padding:"2px 4px",cursor:"pointer",flexShrink:0}}>✕</button>
      </div>
      <div style={{display:"flex",gap:5,marginTop:10,flexWrap:"wrap"}}>
        {Object.entries(STATUS).map(([k,cfg])=>(
          <button key={k} onClick={e=>{e.stopPropagation();onStatus(task.id,k);}} style={{
            background:task.status===k?cfg.bg:"transparent",
            border:`1px solid ${task.status===k?cfg.color:C.border}`,
            color:task.status===k?cfg.color:C.textMuted,
            borderRadius:20,padding:"4px 10px",fontSize:10,fontWeight:600,cursor:"pointer"}}>
            {cfg.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [claudeKey,setClaudeKey]=useState(()=>LS.get("tf_claude",""));
  const [zapiInst,setZapiInst]=useState(()=>LS.get("tf_inst",""));
  const [zapiTok,setZapiTok]=useState(()=>LS.get("tf_tok",""));
  useEffect(()=>LS.set("tf_claude",claudeKey),[claudeKey]);
  useEffect(()=>LS.set("tf_inst",zapiInst),[zapiInst]);
  useEffect(()=>LS.set("tf_tok",zapiTok),[zapiTok]);

  const [tasks,setTasks]=useState(()=>LS.get("tf_tasks",[]));
  useEffect(()=>LS.set("tf_tasks",tasks),[tasks]);

  const [view,setView]=useState("home");
  const [chats,setChats]=useState([]);
  const [monitored,setMonitored]=useState(()=>LS.get("tf_monitored",[]));
  useEffect(()=>LS.set("tf_monitored",monitored),[monitored]);
  const [zapiStatus,setZapiStatus]=useState("disconnected");
  const [qr,setQr]=useState(null);
  const [zapiErr,setZapiErr]=useState(null);
  const [syncLog,setSyncLog]=useState([]);
  const [syncing,setSyncing]=useState(false);
  const [autoSync,setAutoSync]=useState(()=>LS.get("tf_autosync",false));
  useEffect(()=>LS.set("tf_autosync",autoSync),[autoSync]);
  const [lastSync,setLastSync]=useState(()=>LS.get("tf_lastsync",""));
  useEffect(()=>LS.set("tf_lastsync",lastSync),[lastSync]);
  const [checkingConn,setChecking]=useState(false);
  const [chatMsgs,setChatMsgs]=useState([{role:"assistant",content:"Olá Joacir! Sou sua assistente de gestão da Unirad. Posso analisar suas conversas do WhatsApp Business e organizar tudo em tarefas. Como posso ajudar?"}]);
  const [chatIn,setChatIn]=useState("");
  const [chatLoad,setChatLoad]=useState(false);
  const [selected,setSelected]=useState(null);
  const [notif,setNotif]=useState(null);
  const [filterStatus,setFilterStatus]=useState("all");
  const [search,setSearch]=useState("");
  const [newBadge,setNewBadge]=useState(0);
  const chatEnd=useRef(null);
  const autoRef=useRef(null);
  const uid=useRef(Date.now());
  const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone===true||window.matchMedia("(display-mode:standalone)").matches;

  useEffect(()=>{chatEnd.current?.scrollIntoView({behavior:"smooth"});},[chatMsgs]);

  // Auto-poll for new webhook messages every 30 seconds
  useEffect(()=>{
    const poll=setInterval(async()=>{
      try{
        const r=await fetch("/webhook-messages/count");
        const d=await r.json();
        if(d.count>0){
          setNewBadge(d.count);
          notify(`📨 ${d.count} nova(s) mensagem(ns) — clique Sync!`,C.orange);
        }
      }catch{}
    },30000);
    return()=>clearInterval(poll);
  },[]);

  // Auto-connect on load
  useEffect(()=>{
    if(zapiInst&&zapiTok){
      checkConn().then(ok=>{ if(ok) loadChats(); });
    }
  },[]);

  // Auto-sync
  useEffect(()=>{
    clearInterval(autoRef.current);
    if(autoSync&&zapiStatus==="connected"){
      autoRef.current=setInterval(()=>doSync(true),30*60*1000);
    }
    return()=>clearInterval(autoRef.current);
  },[autoSync,zapiStatus,monitored]);

  const notify=(msg,color=C.accent)=>{setNotif({msg,color});setTimeout(()=>setNotif(null),3200);};
  const onStatus=(id,s)=>setTasks(p=>p.map(t=>t.id===id?{...t,status:s}:t));
  const onDelete=(id)=>{setTasks(p=>p.filter(t=>t.id!==id));notify("Tarefa removida.",C.red);};

  const stats={
    total:tasks.length,
    todo:tasks.filter(t=>t.status==="todo").length,
    doing:tasks.filter(t=>t.status==="doing").length,
    done:tasks.filter(t=>t.status==="done").length,
    urgent:tasks.filter(t=>t.priority==="high"&&t.status!=="done").length,
  };

  async function fetchQr(){
    // First check if already connected
    const already = await checkConn();
    if(already){ loadChats(); notify("WhatsApp já conectado! ✓"); return; }
    if(!zapiInst||!zapiTok){notify("Configure credenciais em Config.",C.red);setView("settings");return;}
    setZapiStatus("connecting");setZapiErr(null);
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/qr-code/image");
      if(d?.value){setQr(d.value);}else if(d?.error){setZapiErr("Erro Z-API: "+d.error);}else if(d?.connected){setZapiStatus("connected");setQr(null);loadChats();notify("Conectado! ✓");}else{setZapiErr("Resposta inesperada: "+JSON.stringify(d).slice(0,100));}
    }catch{setZapiErr("Erro de conexão.");setZapiStatus("disconnected");}
  }

  async function checkConn(){
    if(!zapiInst||!zapiTok)return false;
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/status");
      if(d?.connected){setZapiStatus("connected");setQr(null);return true;}
      return false;
    }catch{return false;}
  }

  async function loadChats(){
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/chats");
      if(Array.isArray(d))setChats(d);
    }catch{setZapiErr("Erro ao buscar conversas.");}
  }

  async function fetchMsgs(phone){
    // Multi Device: use /messages endpoint
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/messages?phone="+phone+"&pageSize=100");
      if(Array.isArray(d)&&d.length>0)return d;
      if(d?.messages&&Array.isArray(d.messages))return d.messages;
    }catch(e){console.error("messages err",e);}
    // Fallback: /last-messages
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/last-messages?phone="+phone+"&qtd=100");
      if(Array.isArray(d)&&d.length>0)return d;
      if(d?.messages)return d.messages;
    }catch(e){console.error("last-messages err",e);}
    // Fallback 2: /all-messages
    try{
      const d=await zapiCall(zapiInst,zapiTok,"/all-messages?phone="+phone);
      if(Array.isArray(d)&&d.length>0)return d;
    }catch(e){console.error("all-messages err",e);}
    return [];
  }

  async function extractTasks(msgs,name){
    if(!claudeKey||!msgs.length)return[];
    const txt=msgs
      .filter(m=>m.text?.message||m.caption||m.body)
      .map(m=>{
        const ts=m.messageTimestamp?new Date(m.messageTimestamp*1000).toLocaleDateString("pt-BR"):"";
        const sender=m.fromMe?"Eu":(m.senderName||m.pushname||name);
        return`[${ts}] ${sender}: ${m.text?.message||m.caption||m.body||""}`;
      }).filter(l=>l.length>15).join("\n");
    if(!txt.trim())return[];
    try{
      const r=await fetch("/claude",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          apiKey:claudeKey,
          model:"claude-sonnet-4-6",max_tokens:3000,
          system:`Você é extrator de tarefas de conversas WhatsApp Business da Unirad Centro de Saúde, Capão da Canoa/RS.
Extraia TODAS as tarefas, compromissos, pendências e decisões.
Título deve ser específico: inclua nomes, valores e datas mencionadas.
Responda APENAS JSON válido sem markdown:
{"items":[{"title":"título específico","type":"task|commitment|pending|decision","priority":"high|medium|low","contact":"nome","date":"YYYY-MM-DD ou null","notes":"contexto"}]}
high=urgente/financeiro/prazo curto. medium=reuniões/retornos. low=geral.`,
          messages:[{role:"user",content:`Conversa com: ${name}\n\n${txt}`}]
        })
      }).then(r=>r.json());
      const parsed=JSON.parse((r.content?.[0]?.text||"{}").replace(/```json\n?|```/g,"").trim());
      return(parsed.items||[]).map(i=>({
        id:++uid.current,title:i.title,
        type:["task","commitment","pending","decision"].includes(i.type)?i.type:"task",
        status:"todo",priority:["high","medium","low"].includes(i.priority)?i.priority:"medium",
        source:`WhatsApp — ${name}`,date:i.date||"",contact:i.contact||name,notes:i.notes||"",
        createdAt:new Date().toISOString(),
      }));
    }catch(e){console.error(e);return[];}
  }

  // Process webhook messages received by server
  async function processWebhookMessages(silent=false){
    if(syncing)return;
    if(!claudeKey){if(!silent)notify("Configure API Key do Claude.",C.red);setView("settings");return;}
    setSyncing(true);
    try{
      const msgs=await fetch("/webhook-messages").then(r=>r.json());
      if(!msgs.length){setSyncing(false);if(!silent)notify("Nenhuma mensagem nova no momento.",C.orange);return;}
      setSyncLog([{name:"Processando mensagens...",status:`${msgs.length} mensagem(ns) recebida(s)`,loading:true}]);
      // Group by sender
      const bySender={};
      msgs.forEach(m=>{
        const key=m.phone||"desconhecido";
        if(!bySender[key]){bySender[key]={name:m.senderName||key,msgs:[]};}
        bySender[key].msgs.push(m);
      });
      const log=[];let total=0;
      for(const [phone,data] of Object.entries(bySender)){
        log.push({name:data.name,status:`${data.msgs.length} msg(s) — extraindo...`,loading:true});setSyncLog([...log]);
        const newT=await extractTasks(data.msgs,data.name);
        const existing=tasks.map(t=>t.title.toLowerCase());
        const unique=newT.filter(t=>!existing.includes(t.title.toLowerCase()));
        total+=unique.length;setTasks(p=>[...unique,...p]);
        log[log.length-1]={name:data.name,status:`✓ ${unique.length} nova(s)`,loading:false};setSyncLog([...log]);
      }
      // Clear processed messages
      await fetch("/webhook-messages/clear",{method:"POST"});
      const now=new Date().toLocaleString("pt-BR");
      setLastSync(now);setSyncing(false);
      setNewBadge(b=>b+total);
      if(!silent){notify(`✓ ${total} nova(s) tarefa(s)!`);if(total>0)setView("tasks");}
    }catch(e){setSyncing(false);console.error(e);}
  }

  async function doSync(silent=false){
    return processWebhookMessages(silent);
  }

  async function sendChat(){
    if(!chatIn.trim()||chatLoad)return;
    if(!claudeKey){notify("Configure API Key do Claude.",C.red);setView("settings");return;}
    const msg=chatIn.trim();
    setChatMsgs(p=>[...p,{role:"user",content:msg}]);
    setChatIn("");setChatLoad(true);
    const summary=tasks.slice(0,40).map(t=>`[${t.status}] ${t.title} | ${t.type} | ${t.priority} | ${t.contact} | ${t.date||"sem data"}`).join("\n");
    try{
      const r=await fetch("/claude",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          apiKey:claudeKey,
          model:"claude-sonnet-4-6",max_tokens:1000,
          system:`Você é assistente de gestão do Joacir Sgarbossa, Co-diretor da Unirad Centro de Saúde, Capão da Canoa/RS.
Tarefas atuais (${tasks.length} total):\n${summary}
Responda em português, de forma objetiva e prática. Ajude a priorizar e tomar decisões.`,
          messages:[...chatMsgs.filter((_,i)=>i>0).slice(-6),{role:"user",content:msg}]
        })
      }).then(r=>r.json());
      setChatMsgs(p=>[...p,{role:"assistant",content:r.content?.[0]?.text||"Não consegui processar."}]);
    }catch{setChatMsgs(p=>[...p,{role:"assistant",content:"Erro ao conectar com a IA."}]);}
    setChatLoad(false);
  }

  const connected=zapiStatus==="connected";
  const filtered=tasks.filter(t=>{
    if(filterStatus!=="all"&&t.status!==filterStatus)return false;
    if(search&&!t.title.toLowerCase().includes(search.toLowerCase())&&!t.contact.toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  });

  const nav=[
    {key:"home",icon:"⊞",label:"Início"},
    {key:"tasks",icon:"☰",label:"Tarefas",badge:newBadge},
    {key:"whatsapp",icon:"📱",label:"WhatsApp"},
    {key:"chat",icon:"✦",label:"IA"},
    {key:"settings",icon:"⚙",label:"Config"},
  ];

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",maxWidth:520,margin:"0 auto",position:"relative"}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}`}</style>

      {notif&&(
        <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",zIndex:999,
          background:C.card,border:`1px solid ${notif.color}`,color:notif.color,
          borderRadius:12,padding:"10px 22px",fontSize:13,fontWeight:600,
          boxShadow:`0 4px 24px ${notif.color}44`,whiteSpace:"nowrap",animation:"fadeIn 0.2s",pointerEvents:"none"}}>
          {notif.msg}
        </div>
      )}

      {/* Header */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"16px 20px 14px",paddingTop:"max(16px,env(safe-area-inset-top))",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:34,height:34,background:C.accent,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:800,color:"#000"}}>✦</div>
          <div>
            <div style={{fontWeight:800,fontSize:17,lineHeight:1}}>TaskFlow</div>
            <div style={{fontSize:9,color:C.textMuted,letterSpacing:"0.08em"}}>UNIRAD · POWERED BY AI</div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {connected&&(
            <div onClick={()=>doSync(false)} className="tap" style={{display:"flex",alignItems:"center",gap:5,background:C.accentDim,border:`1px solid ${C.accentSoft}`,borderRadius:20,padding:"5px 12px",cursor:"pointer"}}>
              {syncing?<Spinner size={12}/>:<span style={{fontSize:13}}>↻</span>}
              <span style={{fontSize:11,fontWeight:600,color:C.accent}}>Sync</span>
            </div>
          )}
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:connected?C.accent:C.textMuted,animation:zapiStatus==="connecting"?"pulse 1s infinite":"none"}}/>
            <span style={{fontSize:11,color:connected?C.accent:C.textMuted,fontWeight:600}}>{connected?"Online":"Offline"}</span>
          </div>
        </div>
      </div>

      <div style={{flex:1,overflow:"auto",paddingBottom:88}}>

        {/* HOME */}
        {view==="home"&&(
          <div style={{padding:"20px 18px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
              {[
                {label:"Total",val:stats.total,color:C.text},
                {label:"A Fazer",val:stats.todo,color:C.blue},
                {label:"Em Andamento",val:stats.doing,color:C.orange},
                {label:"Urgentes",val:stats.urgent,color:C.red},
              ].map(s=>(
                <div key={s.label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 18px"}}>
                  <div style={{fontSize:10,color:C.textMuted,fontWeight:600,letterSpacing:"0.06em",marginBottom:6}}>{s.label.toUpperCase()}</div>
                  <div style={{fontSize:32,fontWeight:800,color:s.color,lineHeight:1}}>{s.val}</div>
                </div>
              ))}
            </div>

            {lastSync&&<div style={{fontSize:11,color:C.textMuted,textAlign:"center",marginBottom:14}}>Última sync: {lastSync}{autoSync&&<span style={{color:C.accent}}> · Auto-sync ativo</span>}</div>}

            {stats.urgent>0&&(
              <div style={{background:C.redDim,border:`1px solid ${C.red}33`,borderRadius:14,padding:"14px 16px",marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:700,color:C.red,marginBottom:10}}>⚠ Alta Prioridade ({stats.urgent})</div>
                {tasks.filter(t=>t.priority==="high"&&t.status!=="done").map(t=>(
                  <div key={t.id} onClick={()=>setSelected(t)} className="tap" style={{marginBottom:8,cursor:"pointer",padding:"8px 10px",background:"#ef444410",borderRadius:8}}>
                    <div style={{fontSize:13,fontWeight:600}}>{t.title}</div>
                    <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>{t.contact}{t.date?` · ${t.date}`:""}</div>
                  </div>
                ))}
              </div>
            )}

            {!connected?(
              <div onClick={()=>setView("whatsapp")} className="tap" style={{background:`linear-gradient(135deg,${C.accentDim},${C.purpleDim})`,border:`1px solid ${C.accentSoft}`,borderRadius:16,padding:"18px 20px",cursor:"pointer",marginBottom:16}}>
                <div style={{fontSize:14,fontWeight:700,color:C.accent,marginBottom:4}}>📱 Conectar WhatsApp Business</div>
                <div style={{fontSize:12,color:C.textDim}}>Extraia tarefas automaticamente das suas conversas</div>
              </div>
            ):(
              <div onClick={()=>doSync(false)} className="tap" style={{background:`linear-gradient(135deg,${C.accentDim},${C.purpleDim})`,border:`1px solid ${C.accentSoft}`,borderRadius:16,padding:"16px 20px",cursor:"pointer",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:C.accent,marginBottom:3}}>{syncing?"⏳ Sincronizando...":"✦ Sincronizar últimos 7 dias"}</div>
                  <div style={{fontSize:11,color:C.textDim}}>{monitored.length} conversa(s) · {autoSync?"Auto 30min":"Manual"}</div>
                </div>
                {syncing?<Spinner/>:<span style={{fontSize:22,color:C.accent}}>↻</span>}
              </div>
            )}

            <div style={{marginBottom:10,fontSize:11,fontWeight:700,color:C.textMuted,letterSpacing:"0.06em"}}>RECENTES</div>
            {tasks.length===0?(
              <div style={{textAlign:"center",padding:"36px 0",color:C.textMuted,fontSize:13}}>
                <div style={{fontSize:32,marginBottom:10}}>○</div>
                Conecte o WhatsApp e sincronize para começar!
              </div>
            ):tasks.slice(0,5).map(t=><TaskCard key={t.id} task={t} onStatus={onStatus} onDelete={onDelete} onClick={setSelected}/>)}
            {tasks.length>5&&(
              <button onClick={()=>{setNewBadge(0);setView("tasks");}} style={{width:"100%",background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,borderRadius:12,padding:"13px",fontSize:13,cursor:"pointer",marginTop:4}}>
                Ver todas as {tasks.length} tarefas →
              </button>
            )}
          </div>
        )}

        {/* TAREFAS */}
        {view==="tasks"&&(
          <div style={{padding:"20px 18px"}}>
            <div style={{fontSize:22,fontWeight:800,marginBottom:14}}>Tarefas</div>
            <div style={{position:"relative",marginBottom:12}}>
              <span style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",fontSize:14,color:C.textMuted}}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por título ou contato..."
                style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:12,color:C.text,padding:"12px 14px 12px 38px",outline:"none",fontSize:14}}/>
            </div>
            <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,marginBottom:14}}>
              {[["all","Todas"],["todo","A Fazer"],["doing","Andamento"],["done","Concluídas"]].map(([k,l])=>(
                <Pill key={k} active={filterStatus===k} color={C.accent} onClick={()=>setFilterStatus(k)}>{l}</Pill>
              ))}
            </div>
            <div style={{fontSize:12,color:C.textMuted,marginBottom:12}}>{filtered.length} tarefa(s)</div>
            {filtered.length===0?(
              <div style={{textAlign:"center",padding:"40px 0",color:C.textMuted}}>
                <div style={{fontSize:28,marginBottom:8}}>○</div>Nenhuma tarefa
              </div>
            ):filtered.map(t=><TaskCard key={t.id} task={t} onStatus={onStatus} onDelete={onDelete} onClick={setSelected}/>)}
          </div>
        )}

        {/* WHATSAPP */}
        {view==="whatsapp"&&(
          <div style={{padding:"20px 18px"}}>
            <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>WhatsApp Business</div>
            <div style={{fontSize:12,color:C.textMuted,marginBottom:14}}>Mensagens chegam automaticamente via webhook em tempo real</div>
            <div style={{background:C.accentDim,border:`1px solid ${C.accentSoft}`,borderRadius:12,padding:"12px 14px",marginBottom:18}}>
              <div style={{fontSize:12,fontWeight:700,color:C.accent,marginBottom:6}}>🔔 URL do Webhook (cole na Z-API)</div>
              <div style={{fontSize:12,color:C.text,fontFamily:"DM Mono,monospace",wordBreak:"break-all"}}>{window.location.origin}/webhook</div>
              <div style={{fontSize:11,color:C.textMuted,marginTop:6}}>Z-API → Webhooks e configurações gerais → "Ao receber"</div>
            </div>

            <div style={{background:C.card,border:`1px solid ${connected?C.accent:C.border}`,borderRadius:14,padding:"14px 16px",marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:connected?C.accent:zapiStatus==="connecting"?C.orange:C.textMuted,animation:zapiStatus==="connecting"?"pulse 1s infinite":"none"}}/>
                  <span style={{fontWeight:700,fontSize:14}}>{connected?"Conectado ✓":zapiStatus==="connecting"?"Aguardando QR...":"Desconectado"}</span>
                </div>
                {connected&&<button onClick={loadChats} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>↻ Atualizar</button>}
              </div>
              {zapiErr&&<div style={{marginTop:8,fontSize:12,color:C.red}}>⚠ {zapiErr}</div>}
            </div>

            {!connected&&(
              <>
                <button onClick={fetchQr} className="tap" style={{width:"100%",background:C.accent,color:"#000",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:12}}>
                  📱 Gerar QR Code
                </button>
                {qr&&(
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"16px 0"}}>
                    <img src={qr} alt="QR" style={{width:220,height:220,borderRadius:12,border:`2px solid ${C.accent}`,background:"#fff",padding:8}}/>
                    <div style={{fontSize:12,color:C.textDim,textAlign:"center",lineHeight:1.7}}>
                      WhatsApp Business → <strong style={{color:C.text}}>⋮ → Aparelhos Conectados → Conectar</strong>
                    </div>
                    <button onClick={async()=>{setChecking(true);const ok=await checkConn();if(ok){loadChats();notify("Conectado! ✓");}else notify("Ainda não conectado.",C.orange);setChecking(false);}} disabled={checkingConn} className="tap" style={{width:"100%",background:"transparent",border:`1px solid ${C.accent}`,color:C.accent,borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>
                      {checkingConn?"Verificando...":"✓ Já escanei"}
                    </button>
                  </div>
                )}
              </>
            )}

            {connected&&(
              <>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:700,color:C.textMuted,letterSpacing:"0.05em"}}>CONVERSAS ({chats.length}) · {monitored.length} selecionada(s)</div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>setMonitored([])} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,borderRadius:8,padding:"4px 8px",fontSize:10,cursor:"pointer"}}>Limpar</button>
                    <button onClick={()=>setMonitored(chats.map(c=>c.phone||c.id?.user))} style={{background:"transparent",border:`1px solid ${C.accent}`,color:C.accent,borderRadius:8,padding:"4px 8px",fontSize:10,cursor:"pointer"}}>Todas</button>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:16}}>
                  {chats.map(chat=>{
                    const phone=chat.phone||chat.id?.user;
                    const name=chat.name||chat.pushname||phone;
                    const isG=chat.isGroup||false;
                    const sel=monitored.includes(phone);
                    return(
                      <div key={phone} onClick={()=>setMonitored(p=>p.includes(phone)?p.filter(x=>x!==phone):[...p,phone])} className="row-tap" style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",background:sel?C.accentDim:C.card,border:`1px solid ${sel?C.accentSoft:C.border}`,borderRadius:14,cursor:"pointer"}}>
                        <div style={{width:42,height:42,borderRadius:"50%",background:isG?C.purpleDim:C.blueDim,border:`1px solid ${isG?C.purple:C.blue}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{isG?"👥":"👤"}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:14,fontWeight:600,color:sel?C.accent:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{name}</div>
                          <div style={{fontSize:11,color:C.textMuted}}>{isG?"Grupo":"Contato"}</div>
                        </div>
                        <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${sel?C.accent:C.border}`,background:sel?C.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          {sel&&<span style={{color:"#000",fontSize:13,fontWeight:800}}>✓</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {monitored.length>0&&(
                  <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                      <div style={{fontSize:13,fontWeight:700}}>Auto-sync (30 min)</div>
                      <div onClick={()=>setAutoSync(p=>!p)} style={{width:44,height:24,borderRadius:12,background:autoSync?C.accent:C.border,cursor:"pointer",position:"relative",transition:"background 0.2s"}}>
                        <div style={{position:"absolute",top:2,left:autoSync?22:2,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/>
                      </div>
                    </div>
                    {syncLog.length>0&&(
                      <div style={{marginBottom:12}}>
                        {syncLog.map((s,i)=>(
                          <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,marginBottom:5}}>
                            {s.loading?<Spinner size={12}/>:<span style={{color:s.status.startsWith("✓")?C.accent:C.orange}}>●</span>}
                            <span style={{color:C.textDim,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{s.name}</span>
                            <span style={{color:s.status.startsWith("✓")?C.accent:C.orange,fontSize:11,flexShrink:0}}>— {s.status}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <button onClick={()=>doSync(false)} disabled={syncing} className="tap" style={{width:"100%",background:syncing?C.border:C.accent,color:syncing?C.textMuted:"#000",border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:700,cursor:syncing?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                      {syncing&&<Spinner size={16} color="#000"/>}
                      {syncing?"Sincronizando...":` ✦ Sincronizar ${monitored.length} conversa(s)`}
                    </button>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {/* CHAT */}
        {view==="chat"&&(
          <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 130px)"}}>
            <div style={{padding:"20px 18px 12px"}}>
              <div style={{fontSize:22,fontWeight:800,marginBottom:2}}>IA Assistente</div>
              <div style={{fontSize:12,color:C.textMuted}}>Converse sobre tarefas e pendências</div>
            </div>
            <div style={{flex:1,overflow:"auto",padding:"0 18px",display:"flex",flexDirection:"column",gap:12}}>
              {chatMsgs.map((m,i)=>(
                <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                  <div style={{maxWidth:"84%",background:m.role==="user"?C.accent:C.card,color:m.role==="user"?"#000":C.text,borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",padding:"11px 14px",fontSize:14,lineHeight:1.6,border:m.role!=="user"?`1px solid ${C.border}`:"none",whiteSpace:"pre-wrap"}}>{m.content}</div>
                </div>
              ))}
              {chatLoad&&<div style={{display:"flex",gap:5,padding:"4px 0"}}>{[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:C.accent,animation:`bounce 1s ${i*0.15}s infinite`}}/>)}</div>}
              <div ref={chatEnd}/>
            </div>
            <div style={{padding:"10px 18px",borderTop:`1px solid ${C.border}`,display:"flex",gap:8,background:C.bg}}>
              <input value={chatIn} onChange={e=>setChatIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendChat()}
                placeholder="Pergunte sobre suas tarefas..."
                style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:24,color:C.text,padding:"12px 16px",outline:"none",fontSize:14}}/>
              <button onClick={sendChat} disabled={chatLoad||!chatIn.trim()} style={{background:C.accent,color:"#000",border:"none",borderRadius:24,padding:"12px 20px",fontSize:15,fontWeight:700,cursor:"pointer",flexShrink:0}}>→</button>
            </div>
          </div>
        )}

        {/* CONFIG */}
        {view==="settings"&&(
          <div style={{padding:"20px 18px"}}>
            <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>Configurações</div>
            <div style={{fontSize:12,color:C.textMuted,marginBottom:18}}>Salvo automaticamente neste dispositivo</div>

            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:18,marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>✦ Claude API Key</div>
              <div style={{fontSize:12,color:C.textMuted,marginBottom:14}}>Necessário para extração de tarefas com IA.</div>
              <Inp label="API KEY" type="password" value={claudeKey} onChange={e=>setClaudeKey(e.target.value)} placeholder="sk-ant-api03-..." hint="console.anthropic.com → Obter chave de API"/>
              {claudeKey&&<div style={{fontSize:12,color:C.accent,marginTop:-8}}>✓ Configurada</div>}
            </div>

            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:18,marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>📱 Z-API</div>
              <Inp label="INSTANCE ID" type="password" value={zapiInst} onChange={e=>setZapiInst(e.target.value)} placeholder="3F41B83E9B62D2CC6A756E30FECD7EC6"/>
              <Inp label="TOKEN" type="password" value={zapiTok} onChange={e=>setZapiTok(e.target.value)} placeholder="0C4D6CA9468069D2453E1C31"/>
              {zapiInst&&zapiTok&&<div style={{fontSize:12,color:C.accent,marginTop:-8}}>✓ Configurado</div>}
            </div>

            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:18,marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>⚙ Dados ({tasks.length} tarefas)</div>
              <button onClick={()=>{if(confirm("Apagar todas as tarefas?"))setTasks([]);}} style={{width:"100%",background:"transparent",border:`1px solid ${C.red}`,color:C.red,borderRadius:12,padding:"11px",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                🗑 Apagar todas as tarefas
              </button>
            </div>

            {isIos&&!isStandalone&&(
              <div style={{background:C.card,border:`1px solid ${C.accentSoft}`,borderRadius:16,padding:18}}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:10,color:C.accent}}>📲 Instalar como App (iPhone)</div>
                <div style={{fontSize:13,color:C.textDim,lineHeight:1.8}}>
                  1. <strong style={{color:C.text}}>Compartilhar (□↑)</strong> no Safari<br/>
                  2. <strong style={{color:C.text}}>"Adicionar à Tela de Início"</strong><br/>
                  3. <strong style={{color:C.text}}>"Adicionar"</strong>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Nav */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:520,background:C.surface,borderTop:`1px solid ${C.border}`,paddingBottom:"max(10px,env(safe-area-inset-bottom))",display:"flex",zIndex:50}}>
        {nav.map(item=>(
          <button key={item.key} onClick={()=>{setView(item.key);if(item.key==="tasks")setNewBadge(0);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"9px 4px 0",background:"transparent",border:"none",cursor:"pointer",color:view===item.key?C.accent:C.textMuted,transition:"color 0.15s",position:"relative"}}>
            <span style={{fontSize:20}}>{item.icon}</span>
            <span style={{fontSize:9,fontWeight:600,letterSpacing:"0.04em"}}>{item.label.toUpperCase()}</span>
            {view===item.key&&<div style={{width:4,height:4,borderRadius:"50%",background:C.accent,marginTop:1}}/>}
            {item.badge>0&&<div style={{position:"absolute",top:6,right:"calc(50% - 14px)",background:C.red,color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{item.badge>9?"9+":item.badge}</div>}
          </button>
        ))}
      </div>

      {/* Modal */}
      {selected&&(
        <div onClick={()=>setSelected(null)} style={{position:"fixed",inset:0,background:"#000000bb",zIndex:200,display:"flex",alignItems:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:"20px 20px 0 0",padding:"20px 18px",paddingBottom:"max(20px,env(safe-area-inset-bottom))",width:"100%",maxWidth:520,margin:"0 auto",animation:"slideUp 0.25s"}}>
            <div style={{width:36,height:4,background:C.border,borderRadius:2,margin:"0 auto 18px"}}/>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
              <Tag color={TYPES[selected.type]?.color||C.blue}>{TYPES[selected.type]?.icon} {TYPES[selected.type]?.label}</Tag>
              <Tag color={PRIO[selected.priority]?.color||C.orange}>{PRIO[selected.priority]?.label}</Tag>
              <Tag color={STATUS[selected.status]?.color||C.blue} bg={STATUS[selected.status]?.bg}>{STATUS[selected.status]?.label}</Tag>
            </div>
            <div style={{fontSize:18,fontWeight:700,marginBottom:14,lineHeight:1.4}}>{selected.title}</div>
            {[["📱",selected.contact],["📅",selected.date||"Sem data"],["🔗",selected.source],["📝",selected.notes||"Sem notas"]].map(([ic,v])=>(
              <div key={ic} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}>
                <span style={{fontSize:14,flexShrink:0}}>{ic}</span>
                <span style={{fontSize:13,color:C.textDim,lineHeight:1.5}}>{v}</span>
              </div>
            ))}
            <div style={{display:"flex",gap:7,marginTop:16}}>
              {Object.entries(STATUS).map(([k,cfg])=>(
                <button key={k} onClick={()=>{onStatus(selected.id,k);setSelected({...selected,status:k});}} style={{flex:1,background:selected.status===k?cfg.bg:"transparent",border:`1px solid ${selected.status===k?cfg.color:C.border}`,color:selected.status===k?cfg.color:C.textMuted,borderRadius:10,padding:"11px 0",fontSize:12,fontWeight:600,cursor:"pointer"}}>{cfg.label}</button>
              ))}
            </div>
            <button onClick={()=>{onDelete(selected.id);setSelected(null);}} style={{width:"100%",marginTop:10,background:"transparent",border:`1px solid ${C.red}33`,color:C.red,borderRadius:10,padding:"10px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Remover tarefa</button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
